[package]
name = "ec2_manager"
version = "0.1.0"
edition = "2021"

[features]
default = []
gui = ["dep:eframe", "dep:portable-pty", "dep:vt100", "dep:arboard", "dep:rfd"]

[profile.release]
# Ship as little about the build machine and the code's shape as possible.
#
# `strip` drops the symbol table — otherwise the binary carries ~20k mangled
# Rust symbols that map out every module and function name.
#
# Absolute source paths are handled separately, by the --remap-path-prefix
# flags that build_binaries.sh puts in RUSTFLAGS: they are compiled in as
# string literals via panic!/#[track_caller] locations no matter what
# debuginfo says, so stripping alone does not remove them. (The `trim-paths`
# profile key would be tidier but is not stable as of cargo 1.94.)
#
# The GUI panic hook uses `Location::file()` rather than a backtrace, so
# stripping costs us nothing in crash logs.
strip = true

[build-dependencies]
serde_json = "1"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "0.33.3", optional = true }
portable-pty = { version = "0.9", optional = true }
vt100 = { version = "0.16.2", optional = true }
arboard = { version = "3", optional = true }
rfd = { version = "0.15", optional = true }
# Used by config.rs (personal-script bodies / PAT in config.ini) as well as
# the GUI, so not gui-gated.
base64 = "0.22"
# Used by the alerts module (lib) as well as the GUI, so not gui-gated.
chrono = "0.4"

# Windows Credential Manager (CredReadW) for the five JSM Ops credentials
# (email/token pair, cloud id, schedule id, Atlassian account id, Opsgenie
# API key). Windows-only so the Linux dev build's dependency tree is
# unchanged.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
] }
